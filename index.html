<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>가면의 원탁</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f5efea; --paper:#fffcfa; --ink:#2b2224; --muted:#7d6f70; --line:#e8dcd8;
  --accent:#7b1e3a; --accent-ink:#fff; --accent-soft:#f4e4e8;
  --wood1:#b8825c; --wood2:#8a573b; --heart:#c8354f;
  --k-think:#5b6e8c; --k-advice:#2f7a5b; --k-question:#b7791f;
  --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(80,20,35,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.wrap.wide{max-width:1100px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:18px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#b9b2a5}
.dot.on{background:#3aa66b}.dot.warn{background:#d9a03a}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
h1{font-size:26px;letter-spacing:-.03em;margin:0 0 6px}
h2{font-size:20px;letter-spacing:-.02em;margin:0 0 10px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input[type=text],textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;transition:border-color .15s}
input[type=text]:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:96px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);transition:transform .05s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.quiet{background:var(--accent-soft);color:var(--accent)}
.btn.big{padding:16px 24px;font-size:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.err{color:#b23b2a;font-size:14px;margin-top:8px;min-height:1em}
.hint{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-size:14px}

/* round table */
.table-zone{position:relative;width:100%;max-width:420px;aspect-ratio:1;margin:8px auto}
.table{position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 38% 32%,#ffffff 0%,#ffffff 55%,#f4eeea 100%);border:1px solid var(--line);box-shadow:inset 0 0 0 8px #fbf7f5,inset 0 0 0 9px var(--line),0 12px 32px rgba(80,20,35,.14);display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--accent);text-align:center}
.table b{font-size:34px;line-height:1}
.table span{font-size:13px;color:var(--muted)}
.seat{position:absolute;transform:translate(-50%,-50%);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:var(--shadow);max-width:40%;overflow:hidden;text-overflow:ellipsis;animation:pop .3s ease}
.seat.me{background:var(--accent);color:#fff;border-color:var(--accent)}
.seat .x{margin-left:6px;border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* agendas */
.agenda-list{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.agenda-list li{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
.agenda-list li.done{opacity:.5}
.agenda-list li.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.focus{background:var(--paper);border:2px solid var(--accent);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.focus .label{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.04em}
.focus .text{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.45;margin-top:6px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.wide .focus .text{font-size:34px}

/* kinds */
.kinds{display:flex;gap:8px;margin:14px 0 8px}
.kind{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;font-weight:700;cursor:pointer;font-size:15px}
.kind[aria-pressed=true]{color:#fff;border-color:transparent}
.kind.think[aria-pressed=true]{background:var(--k-think)}
.kind.advice[aria-pressed=true]{background:var(--k-advice)}
.kind.question[aria-pressed=true]{background:var(--k-question)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;color:#fff}
.tag.think{background:var(--k-think)}.tag.advice{background:var(--k-advice)}.tag.question{background:var(--k-question)}

.mine{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.mine li{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.mine li .t{flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
.mine li button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px}

.cards{display:grid;gap:12px;grid-template-columns:1fr;margin-top:14px}
.wide .cards{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.op{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;animation:rise .35s ease both}
.op .t{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.wide .op .t{font-size:19px}
.op .foot{display:flex;align-items:center;justify-content:space-between}
.like{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
.like[aria-pressed=true]{background:#fdebe7;border-color:#f3c3b9;color:var(--heart)}
.likes{font-weight:800;color:var(--heart);font-size:15px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.ifowner{margin-top:14px;border-radius:20px;padding:28px 22px;background:var(--accent);color:#fff;text-align:center;box-shadow:var(--shadow);animation:rise .4s ease both}
.ifowner .big{font-size:28px;font-weight:800;letter-spacing:-.03em;word-break:keep-all;line-height:1.3}
.wide .ifowner .big{font-size:46px}
.ifowner .sub{opacity:.9;font-size:21px;margin-top:8px;word-break:keep-all}
.award-sec{margin-top:18px}
.award-sec h3{display:flex;gap:10px;align-items:flex-start;font-size:17px;margin:0 0 8px;letter-spacing:-.02em}
.king{text-align:center;padding:30px 20px;border-radius:20px;background:linear-gradient(160deg,var(--accent),#4f1024);color:#fff;box-shadow:var(--shadow)}
.king .crown{font-size:46px;line-height:1}
.king .title{font-size:14px;font-weight:800;letter-spacing:.12em;opacity:.85;margin-top:8px}
.king .names{font-size:36px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.wide .king .names{font-size:56px}
.king .cnt{opacity:.85;margin-top:4px}
.like-note{color:var(--heart);font-weight:700;font-size:18px;margin:4px 0 12px}
.rf-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rf-row{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;color:inherit}
button.rf-row{cursor:pointer;transition:border-color .15s,box-shadow .15s}
button.rf-row:hover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.rf-nick{flex:none;min-width:88px;font-weight:800;color:var(--accent);font-size:17px}
.card>.row .rf-nick{font-size:24px}
.rf-ag{flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
.rf-go{flex:none;color:var(--muted);font-size:22px}
.wide .rf-row{font-size:19px;padding:18px 20px}.wide .rf-nick{font-size:20px;min-width:120px}
.wrap.has-qr{padding-bottom:190px}
.qr-mini{position:fixed;right:16px;bottom:16px;z-index:8;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 8px 6px;box-shadow:var(--shadow);cursor:pointer;font:inherit}
.qr-mini svg{width:112px;height:112px;display:block}
.qr-mini span{font-weight:800;font-size:14px;color:var(--accent);letter-spacing:.04em}
.qr-over{position:fixed;inset:0;z-index:20;background:rgba(43,34,36,.62);display:flex;align-items:center;justify-content:center;padding:16px;cursor:pointer}
.qr-big{background:#fff;border-radius:24px;padding:28px;text-align:center;max-width:92vw}
.qr-big svg{width:min(58vh,72vw);height:min(58vh,72vw);display:block;margin:0 auto}
.wrap.player{padding-bottom:72px}
.leave-note{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;text-align:center;padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
.leave-warn{position:fixed;inset:0;z-index:30;background:rgba(43,34,36,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.leave-warn .card{max-width:420px;width:100%}
.counter{font-size:64px;font-weight:800;line-height:1;color:var(--accent)}
.host-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.host-grid{grid-template-columns:360px 1fr}}
.qr svg{width:180px;height:180px;display:block;background:#fff;border-radius:12px;padding:6px}
.code{font-size:44px;font-weight:800;letter-spacing:.18em}
.linkbox{font-size:13px;word-break:break-all;background:#fff;border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.progress{display:flex;gap:6px;margin:8px 0}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.done{background:var(--accent)}
.progress i.now{background:var(--k-question)}
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.center{text-align:center}
.mt{margin-top:14px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-database-compat.js"></script>
<script>//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;

function hostTransport(code, hid, onMsg, onStatus){

/* ===================== 진행자 ===================== */
function runHost(code){

  // S.players[token] = {nick, agenda}
  // S.order = [token...]  (어젠더 주인 토큰 — 절대 밖으로 나가지 않음)
  // S.rounds[i] = {entries:[{id, by, kind, text, likes:[token]}], revealOrder:[id]}
  const connTok = new Map(); // connId -> token

  function round(i){ return S.rounds[i] || (S.rounds[i] = {entries:[], revealOrder:[]}); }

  // 생각 → 조언 → 질문 순으로 묶고, 같은 종류 안에서는 공개 때 섞은 순서를 유지
  const KORD = {think:0, advice:1, question:2};
  function cardsOf(i){ const r = round(i); const base = r.revealOrder.length ? r.revealOrder.map(id=>r.entries.find(e=>e.id===id)).filter(Boolean) : r.entries; return base.slice().sort((a,b)=>(KORD[a.kind]??9)-(KORD[b.kind]??9)); }
  function heartsData(){
    return S.order.map((t,i)=>({ no:i+1, agenda:S.players[t]?.agenda || '',
      items: cardsOf(i).filter(e=>e.likes.length).sort((a,b)=>b.likes.length-a.likes.length).map(e=>({kind:e.kind,text:e.text,likes:e.likes.length})) }));
  }
  function reflectData(){
    const sel = typeof S.rsel==='number' ? S.rsel : -1;
    const list = S.order.map(t=>({nick:S.players[t]?.nick||'(나간 참가자)', agenda:S.players[t]?.agenda||''}));
    let detail = null;
    if(sel>=0 && sel<S.order.length){ const t=S.order[sel];
      detail = { no:sel+1, nick:list[sel].nick, agenda:list[sel].agenda, items: cardsOf(sel).map(e=>({kind:e.kind,text:e.text,likes:e.likes.length})) }; }
    return { sel: detail?sel:-1, list, detail };
  }
  function kingData(){
    const tally = {};
    S.order.forEach((_,i)=>round(i).entries.forEach(e=>{ tally[e.by] = (tally[e.by]||0) + e.likes.length; }));
    const max = Math.max(0, ...Object.values(tally));
    const names = max ? Object.keys(tally).filter(t=>tally[t]===max && S.players[t]).map(t=>S.players[t].nick) : [];
    return { likes:max, names };
  }

  function viewFor(tok){
    const p = S.players[tok];
    const v = { phase:S.phase, joined:!!p, me: p?{nick:p.nick}:null, nicks:nicks(), total:S.order.length || S.joinOrder.length, cur:S.cur };
    if(S.phase!=='lobby') v.agendas = S.order.map(t=>S.players[t] ? S.players[t].agenda : '(나간 참가자)');

          .map(e=>({kind:e.kind,text:e.text,likes:e.likes.length})) };

        items: cardsOf(i).filter(e=>e.by===tok).map(e=>({kind:e.kind,text:e.text,likes:e.likes.length})) })).filter(g=>g.items.length);
    }

  }
  function sendState(cid, tok){ tr.send(cid, {t:'state', s:viewFor(tok)}); }

  function reply(cid, m){ tr.send(cid, m); }

  function onMsg(cid, m){

        S.alias = S.alias || {}; S.alias[raw] = found; connTok.set(cid, found);

        if(!nick || !agenda){ reply(cid,{t:'error',msg:'가명과 어젠더를 모두 적어 주세요.'}); break; }
        if(Object.values(S.players).some(x=>x.nick===nick)){ reply(cid,{t:'error',msg:'이미 쓰고 있는 가명이에요. 다른 가명을 골라 주세요. 입장했다가 다시 들어온 거라면 아래 \'다시 들어가기\'를 이용해 주세요.'}); break; }
        S.players[tok] = {nick, agenda}; S.joinOrder.push(tok);
        push(); break;
      }
      case 'entry': {
        if(!p || S.phase!=='writing') break;
        const text = String(m.text||'').trim().slice(0,MAX_ENTRY);
        const kind = KINDS[m.kind] ? m.kind : 'think';
        const id = String(m.id||rid()).slice(0,20);
        const r = round(S.cur);
        if(!text || r.entries.some(e=>e.id===id)) { reply(cid,{t:'state',s:viewFor(tok)}); break; }
        r.entries.push({id, by:tok, kind, text, likes:[]});
        push(); break;
      }
      case 'delEntry': {
        if(!p || S.phase!=='writing') break;
        const r = round(S.cur);
        r.entries = r.entries.filter(e=>!(e.id===m.id && e.by===tok));
        push(); break;
      }
      case 'like': {
        if(!p || (S.phase!=='reveal' && S.phase!=='ifowner')) break;
        const e = round(S.cur).entries.find(e=>e.id===m.id);
        if(!e) break;
        const i = e.likes.indexOf(tok);
        if(i>=0) e.likes.splice(i,1); else e.likes.push(tok);
        push(); break;
      }
    }
  }

  // 진행자 조작
  const act = {
    start(){ const toks = S.joinOrder.filter(t=>S.players[t]); if(toks.length<2) return; S.order = shuffle(toks); S.phase='board'; S.cur=0; push(); },
    begin(){ S.phase='writing'; push(); },
    reveal(){ const r=round(S.cur); const ids = r.entries.map(e=>e.id);
      // 이전으로 돌아왔다 다시 공개해도 기존 카드 순서는 유지, 새 의견만 섞어서 뒤에 붙임
      const kept = (r.revealOrder||[]).filter(id=>ids.includes(id));
      r.revealOrder = kept.concat(shuffle(ids.filter(id=>!kept.includes(id)))); S.phase='reveal'; push(); },
    back(){
      const last = S.order.length-1;
      const prev = {
        board: ()=>{ S.phase='lobby'; },
        writing: ()=>{ if(S.cur>0){ S.cur--; S.phase='ifowner'; } else S.phase='board'; },
        reveal: ()=>{ S.phase='writing'; },
        ifowner: ()=>{ S.phase='reveal'; },
        review: ()=>{ S.cur=last; S.phase='ifowner'; },
        hearts: ()=>{ S.phase='review'; },
        king: ()=>{ S.phase='hearts'; },
        reflect: ()=>{ S.phase='king'; },
        end: ()=>{ S.phase='reflect'; S.rsel=-1; },

    next(){ if(S.cur < S.order.length-1){ S.cur++; S.phase='writing'; } else { S.phase='review'; } push(); },
    hearts(){ S.phase='hearts'; push(); },
    king(){ S.phase='king'; push(); },
    qrBig(){ qrOpen = !qrOpen; render(); },
    reflect(){ S.phase='reflect'; S.rsel=-1; push(); },
    reflectSel(i){ if(S.phase!=='reflect') return; S.rsel = i; push(); },
    reflectBack(){ S.rsel=-1; push(); },
    end(){ S.phase='end'; push(); },
    kick(nick){ const tok = Object.keys(S.players).find(t=>S.players[t].nick===nick); if(!tok || S.phase!=='lobby') return;
      if(!confirm(`'${nick}' 님을 내보낼까요?`)) return;
      delete S.players[tok]; S.joinOrder = S.joinOrder.filter(t=>t!==tok); push(); },
    finish(){ if(!confirm('모임을 닫고 이 기기에 남은 기록을 모두 지울까요?\n참가자들이 자료를 내려받았는지 먼저 확인해 주세요.')) return;
      store.del(KEY); store.del('own-'+code); S = null; tr.destroy().then(()=>{ location.href = baseUrl(); }); setTimeout(()=>{ location.href = baseUrl(); }, 3000); }
  };

  function statusPill(){
    const lab = {on:'방 열림', connecting:'방 여는 중…', warn:'네트워크 확인 필요'}[status];
    const online = onlineCount();
    return `<span class="pill"><span class="dot ${status==='on'?'on':status==='warn'?'warn':''}"></span>${lab}${status==='on'?` · 접속 ${online}`:''}</span>`;
  }
  function progress(){
    return `<div class="progress">${S.order.map((_,i)=>`<i class="${i<S.cur||['review','hearts','king','reflect','end'].includes(S.phase)?'done':i===S.cur?'now':''}"></i>`).join('')}</div>`;
  }
  function qrSvg(url){ if(qrCache[url]) return qrCache[url]; try{ const q = qrcode(0,'M'); q.addData(url); q.make(); return (qrCache[url] = q.createSvgTag({cellSize:4,margin:2,scalable:true})); }catch(e){ return ''; } }

  function render(){
    if(!S) return;
    const url = joinUrl();
    const head = `<header class="top"><div class="brand">가면의 원탁<small>진행자 화면 · 방 코드 ${code}</small></div><div class="row" style="gap:8px">${S.phase!=='lobby'?'<button class="btn quiet" data-act="back" style="padding:8px 14px;font-size:14px">← 이전</button>':''}${statusPill()}</div></header>`;
    let body = '';
    const ns = nicks();
    if(S.phase==='lobby'){
      body = `<div class="host-grid">
        <div class="card">
          <h2>참가자 초대</h2>
          <p class="muted small">QR을 찍거나 링크로 들어오면 가명과 어젠더를 적고 원탁에 앉습니다.</p>
          <div class="row" style="align-items:flex-start;gap:16px">
            <div class="qr">${qrSvg(url)}</div>
            <div><div class="muted small">방 코드</div><div class="code">${code}</div></div>
          </div>
          <div class="linkbox mt">${esc(url)}</div>
          <p class="small muted mt">참가자에게는 이 참가 링크나 QR을 알려 주세요. 지금 브라우저 주소창의 주소는 진행자 전용이에요.</p>
          <div class="row mt"><button class="btn quiet" data-act="copy">링크 복사</button></div>
          ${location.protocol==='file:'?`<p class="err">지금은 파일로 열려 있어서 다른 사람이 이 링크로 들어올 수 없어요. GitHub Pages 같은 웹 주소에 올려서 사용해 주세요.</p>`:''}
        </div>
        <div class="card">
          <h2>원탁</h2>
          ${roundTable(ns, null, true)}
          <p class="center muted small">${ns.length<2?'2명 이상 모이면 시작할 수 있어요.':'모두 앉았으면 시작하세요. 어젠더 순서는 무작위로 정해져요.'}</p>
          <div class="center"><button class="btn big" data-act="start" ${ns.length<2?'disabled':''}>어젠더 순서 정하고 시작</button></div>
        </div></div>`;
    } else if(S.phase==='board'){
      body = `<div class="card"><h2>오늘의 어젠더 ${S.order.length}개</h2>
        <p class="muted small">순서가 무작위로 정해졌어요. 누구의 어젠더인지는 아무도 모릅니다.</p>
        ${agendaList(-1)}
        <div class="center mt"><button class="btn big" data-act="begin">1번 어젠더 시작</button></div></div>`;
    } else if(S.phase==='writing'){
      const r = round(S.cur);
      body = `<div class="host-grid">
        <div class="card"><h2>진행 상황</h2>${progress()}${agendaList(S.cur)}</div>
        <div>
          <div class="focus"><div class="label">${S.cur+1}번 어젠더 · ${S.cur+1} / ${S.order.length}</div><div class="text">${esc(S.players[S.order[S.cur]]?.agenda)}</div></div>
          <div class="card mt center">
            <p class="muted">각자 생각, 조언, 질문을 적고 있어요</p>
            <div class="counter">${r.entries.length}</div><p class="muted small">개의 의견이 도착했어요</p>
            <button class="btn big mt" data-act="reveal">의견 공개하기</button>
          </div>
        </div></div>`;
    } else if(S.phase==='reveal' || S.phase==='ifowner'){
      const cards = cardsOf(S.cur);
      const last = S.cur===S.order.length-1;
      const cardList = `<div class="cards">${cards.map(e=>cardHtml({...e,likes:e.likes.length},false)).join('') || '<p class="muted">도착한 의견이 없어요.</p>'}</div>`;
      const focus = `<div class="focus"><div class="label">${S.cur+1}번 어젠더 · 의견 ${cards.length}개</div><div class="text">${esc(S.players[S.order[S.cur]]?.agenda)}</div></div>`;
      body = S.phase==='reveal'
        ? `${focus}${cardList}<div class="center mt"><p class="like-note">♥ 마음에 드는 의견에 공감을 눌러주세요.</p><button class="btn big" data-act="ifowner">${IFOWNER}</button></div>`
        : `${focus}<div class="ifowner"><div class="big">${IFOWNER}</div></div>${cardList}
           <div class="center mt"><p class="like-note">♥ 마음에 드는 의견에 공감을 눌러주세요.</p><button class="btn big" data-act="next">${last?'어젠더 다시 보기':'다음 어젠더로'}</button></div>`;
    } else if(S.phase==='review'){
      body = `<div class="card"><h2>오늘 함께 다룬 어젠더 ${S.order.length}개</h2>
        ${agendaList(-1)}
        <div class="center mt"><button class="btn big" data-act="hearts">공감 받은 의견 보기</button></div></div>`;
    } else if(S.phase==='hearts'){
      body = `<div class="card">${heartsHtml(heartsData())}
        <div class="center mt"><button class="btn big" data-act="king">오늘의 공감왕 발표</button></div></div>`;
    } else if(S.phase==='king'){
      body = `${kingHtml(kingData())}<div class="center mt"><button class="btn big" data-act="reflect">${REFLECT}</button></div>`;
    } else if(S.phase==='reflect'){
      body = reflectHtml(reflectData(), true);
    } else if(S.phase==='end'){
      body = `<div class="card center"><h1>모임을 마칩니다</h1>
        <p class="muted">참가자들은 각자 화면에서 <b>자기 어젠더에 달린 의견</b>을 내려받을 수 있어요.<br>모두 받았는지 확인한 뒤 모임을 닫아 주세요.</p>
        ${roundTable(ns,null,false)}
        <button class="btn big ghost" data-act="finish">모임 닫고 기록 지우기</button></div>`;
    }
    let qrw = '';
    if(S.phase!=='lobby'){
      const svg = qrSvg(url);
      qrw = `<button class="qr-mini" data-act="qrBig" title="눌러서 크게 보기">${svg}<span>방 ${code}</span></button>`
        + (qrOpen ? `<div class="qr-over" data-act="qrBig"><div class="qr-big">${svg}<div class="code">${code}</div><div class="linkbox mt">${esc(url)}</div><p class="small muted mt">화면을 누르면 닫혀요</p></div></div>` : '');
    }
    $app.innerHTML = `<div class="wrap wide ${S.phase!=='lobby'?'has-qr':''}">${head}${body}</div>${qrw}`;
  }
  function agendaList(now){
    return `<ol class="agenda-list">${S.order.map((t,i)=>`<li class="${now>=0&&i<now?'done':i===now?'now':''}"><span class="num">${i+1}</span><span>${esc(S.players[t]?.agenda)}</span></li>`).join('')}</ol>`;
  }
  $app.addEventListener('click', e=>{
    const b = e.target.closest('[data-act],[data-kick],[data-sel]'); if(!b) return;
    if(b.dataset.kick) return act.kick(b.dataset.kick);
    if(b.dataset.sel) return act.reflectSel(+b.dataset.sel);
    const a = b.dataset.act;
    if(a==='copy'){ navigator.clipboard?.writeText(joinUrl()).then(()=>toast('링크를 복사했어요'),()=>toast('복사에 실패했어요')); return; }
    act[a] && act[a]();
  });
  render();
  window.__host = {get S(){return S;}}; // 테스트용
}

/* ===================== 참가자 ===================== */
function runPlayer(code){
  const TK = 'tok-'+code;
  let token = store.get(TK);
  if(!token){ token = rid(16); store.set(TK, token); }
  // 뒤로가기를 눌러도 한 번은 이 페이지에 머물게 하고 경고를 보여줌
  let armed = false;
  function arm(){ if(armed) return; try{ history.pushState({stay:1}, '', location.href); armed = true; }catch(e){} }
  ['pointerdown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev, arm, {capture:true, passive:true}));
  arm();
  window.addEventListener('popstate', ()=>{ armed = false; arm(); showLeaveWarn(); });
  window.addEventListener('beforeunload', e=>{ if(V && V.joined && V.phase!=='end'){ e.preventDefault(); e.returnValue=''; } });
  function showLeaveWarn(){
    let w = document.getElementById('leaveWarn');
    if(!w){ w = document.createElement('div'); w.id='leaveWarn'; w.className='leave-warn';
      w.innerHTML = '<div class="card center"><h2>잠깐만요!</h2><p>뒤로가기를 누르면 원탁을 떠나게 돼요.<br>이 화면에 그대로 머물러 주세요.</p><button class="btn block mt" id="leaveOk">계속 참여하기</button></div>';
      document.body.appendChild(w); w.querySelector('#leaveOk').onclick = ()=>w.remove(); }
  }
  let V = null, status='connecting', err='', kind='think', draft='', joinDraft={nick:'',agenda:''}, sending=false, rendered='', renderedCur=-1;
  const RK = 'refl-'+code;
  let refl = store.get(RK) || {insight:'', plan:''};
  function reflForm(title){
    return `<div class="card mt" id="rf-form"><h2>${title}</h2>
      <p class="small muted">내 휴대폰에만 저장되고, 마지막에 받는 기록 파일에 함께 담겨요. 발표 중에도 계속 고칠 수 있어요.</p>
      <label for="rfInsight">성찰</label>
      <textarea id="rfInsight" data-refl="insight" maxlength="3000" placeholder="오늘 성찰하거나 새롭게 본 것">${esc(refl.insight)}</textarea>
      <label for="rfPlan">계획</label>
      <textarea id="rfPlan" data-refl="plan" maxlength="3000" placeholder="앞으로 해볼 첫 번째 행동과 언제 할지">${esc(refl.plan)}</textarea>
      <p class="small muted" id="rfSaved" style="min-height:1.4em;margin-top:6px"></p></div>`;
  }
  $app.addEventListener('input', e=>{
    const k = e.target.dataset && e.target.dataset.refl; if(!k) return;
    refl[k] = e.target.value; store.set(RK, refl);
    const sv = document.getElementById('rfSaved'); if(sv) sv.textContent = '✓ 자동 저장됨';
  });
  const tr = clientTransport(code, onMsg, st=>{ status=st; render(); }, ()=>hello());

  // 3초마다 진행자에게 신호를 보내 최신 화면을 받고, 응답이 끊기면 다시 연결
  let lastMsg = Date.now(), lastState = '';
  function hello(){ tr.send({t:'hello', token, h: lastState ? hashStr(lastState) : ''}); }
  setInterval(()=>{
    if(tr.isOpen()){
      hello();
      if(Date.now()-lastMsg > 10000){ lastMsg = Date.now(); tr.reset(); }
    } else lastMsg = Date.now();
  }, 3000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') hello(); });
  function onMsg(m){
    lastMsg = Date.now();
    const wasOff = status!=='on'; status='on';
    if(m.t==='pong'){ if(wasOff) render(); return; }
    if(m.t==='state'){ const js = JSON.stringify(m.s); if(js===lastState && !sending && !err && !wasOff){ return; } lastState = js;
      const prevPhase = V&&V.phase, prevCur = V&&V.cur; V = m.s; err=''; sending=false;
      if(prevPhase!==V.phase || prevCur!==V.cur) { if(V.phase==='writing' && (prevCur!==V.cur)) draft=''; window.scrollTo(0,0); }
      render(); }
    else if(m.t==='error'){ err = m.msg; sending=false; render(); }
  }

  function statusPill(){
    const lab = {on:'연결됨', connecting:'연결 중…', warn:'진행자를 찾는 중…'}[status];
    return `<span class="pill"><span class="dot ${status==='on'?'on':status==='warn'?'warn':''}"></span>${lab}</span>`;
  }

  function render(){
    // 글을 쓰는 중에는 입력칸을 다시 그리지 않음 (한글 입력이 끊기지 않도록)
    if(V && !V.joined && rendered===(V.phase==='lobby'?'join':'rejoin') && document.getElementById('rejoinNick')){
      const pill = $app.querySelector('header.top .pill'); if(pill) pill.outerHTML = statusPill();
      $app.querySelectorAll('[data-act=join],[data-act=rejoin]').forEach(b=>b.disabled = (status!=='on'||sending));
      const er = $app.querySelector('.err'); if(er) er.textContent = err;
      return;
    }
    if(V && V.phase==='writing' && rendered==='writing' && renderedCur===V.cur && document.getElementById('entryText')){
      const pill = $app.querySelector('header.top .pill'); if(pill) pill.outerHTML = statusPill();
      const sb = $app.querySelector('[data-act=send]'); if(sb) sb.disabled = (status!=='on');
      const live = document.getElementById('w-live'); if(live) live.innerHTML = writingLive();
      $app.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.kind===kind)));
      const et = document.getElementById('entryText'); if(et) et.placeholder = kindPlaceholder();
      return;
    }
    // 성찰·계획 작성 중에는 입력칸을 다시 그리지 않고 나머지만 갱신
    if(V && (V.phase==='reflect'||V.phase==='end') && rendered===V.phase && document.getElementById('rf-form')){
      const pill = $app.querySelector('header.top .pill'); if(pill) pill.outerHTML = statusPill();
      const live = document.getElementById('rf-live'); if(live && V.phase==='reflect') live.innerHTML = reflectBody(V.reflect, false);
      return;
    }
    // 입력 중인 값 보존
    const ta = document.getElementById('entryText'); const focused = document.activeElement && document.activeElement.id;
    if(ta) draft = ta.value;
    const nn = document.getElementById('nick'), ag = document.getElementById('agenda');
    if(nn) joinDraft.nick = nn.value; if(ag) joinDraft.agenda = ag.value;

    const head = `<header class="top"><div class="brand">가면의 원탁<small>${V&&V.me?`나의 가명 · ${esc(V.me.nick)}`:'방 코드 '+code}</small></div>${statusPill()}</header>`;
    let body='';
    if(!V){
      body = `<div class="card center"><p class="muted">진행자에게 연결하고 있어요…</p><p class="small muted">진행자 화면이 열려 있는지 확인해 주세요.</p></div>`;
    } else if(!V.joined){
      if(V.phase!=='lobby'){ body = `<div class="card"><h2>다시 들어가기</h2><p class="muted small">모임이 이미 시작됐어요. 처음 입장할 때 쓴 가명을 적으면 원래 자리로 돌아가요.</p>
        <label for="rejoinNick">내 가명</label><input type="text" id="rejoinNick" maxlength="${MAX_NICK}" autocomplete="off">
        <button class="btn block big mt" data-act="rejoin" ${status!=='on'||sending?'disabled':''}>다시 들어가기</button><div class="err">${esc(err)}</div></div>`; }
      else body = `<div class="card">
        <h1>원탁에 앉기</h1>
        <p class="muted small">누가 누구인지, 어떤 어젠더가 누구 것인지 끝까지 공개되지 않아요.</p>
        <label for="nick">가명</label>
        <input type="text" id="nick" maxlength="${MAX_NICK}" placeholder="예: 새벽산책" value="${esc(joinDraft.nick)}" autocomplete="off">
        <label for="agenda">이번 모임에서 다루고 싶은 어젠더</label>
        <textarea id="agenda" maxlength="${MAX_AGENDA}" placeholder="얻고 싶은 고민 해결이나 이루고 싶은 목표를 적어 주세요">${esc(joinDraft.agenda)}</textarea>
        <p class="small muted">이 내용이 그대로 전체 게시판에 올라가요. 나를 짐작할 수 있는 이름이나 표현은 빼 주세요.</p>
        <button class="btn block big mt" data-act="join" ${status!=='on'||sending?'disabled':''}>입장하기</button>
        <div class="err">${esc(err)}</div></div>
        <div class="card"><h2>다시 들어가기</h2><p class="muted small">이미 입장했다가 나간 분은 쓰던 가명만 적어 주세요.</p>
        <div class="row"><input type="text" id="rejoinNick" maxlength="${MAX_NICK}" placeholder="내 가명" autocomplete="off" style="flex:1"><button class="btn quiet" data-act="rejoin" ${status!=='on'||sending?'disabled':''}>다시 들어가기</button></div></div>`;
    } else if(V.phase==='lobby'){
      body = `<div class="card"><h2>원탁에 앉았어요</h2><p class="muted small">모두 모이면 진행자가 어젠더 순서를 정하고 시작해요.</p>${roundTable(V.nicks, V.me.nick, false)}</div>`;
    } else if(V.phase==='board'){
      body = `<div class="card"><h2>오늘의 어젠더 ${V.agendas.length}개</h2><p class="muted small">무작위로 정해진 순서예요. 내 어젠더가 있어도 티 내지 않기!</p>${list(-1)}</div>`;
    } else if(V.phase==='writing'){
      body = `<div class="focus"><div class="label">${V.cur+1}번 어젠더 · ${V.cur+1} / ${V.agendas.length}</div><div class="text">${esc(V.agendas[V.cur])}</div></div>
        <div class="card mt">
          <h2>나의 생각 · 조언 · 질문</h2>
          <p class="small muted">이름 없이 전달돼요. 여러 개 보내도 좋아요.</p>
          <div class="kinds">${Object.entries(KINDS).map(([k,l])=>`<button class="kind ${k}" data-kind="${k}" aria-pressed="${kind===k}">${l}</button>`).join('')}</div>

    } else if(V.phase==='reveal' || V.phase==='ifowner'){
      body = `<div class="focus"><div class="label">${V.cur+1}번 어젠더 · 의견 ${V.cards.length}개</div><div class="text">${esc(V.agendas[V.cur])}</div></div>
        ${V.phase==='ifowner'?`<div class="ifowner"><div class="big">${IFOWNER}</div></div>`:`<p class="small muted mt">마음에 닿은 의견에 공감을 눌러 주세요.</p>`}
        <div class="cards">${V.cards.map(e=>cardHtml(e,true)).join('') || '<p class="muted">도착한 의견이 없어요.</p>'}</div>`;
    } else if(V.phase==='review'){
      body = `<div class="card"><h2>오늘 함께 다룬 어젠더 ${V.agendas.length}개</h2>${list(-1)}</div>`;
    } else if(V.phase==='hearts'){

    } else if(V.phase==='king'){

    } else if(V.phase==='reflect'){

    } else if(V.phase==='end'){
      body = `<div class="card center"><h1>함께해 주셔서 고마워요</h1>
        ${V.pack?`<p class="muted">내 어젠더와 받은 의견, 내가 남긴 의견, 성찰과 계획을 한 파일로 가져가세요.<br>진행자가 모임을 닫으면 사라지고, 어디에도 저장되지 않아요.</p>
          <div class="row" style="justify-content:center"><button class="btn big" data-act="download">파일로 받기</button><button class="btn big quiet" data-act="copy">복사하기</button></div>`
          :`<p class="muted">모든 어젠더를 마쳤어요.</p>`}
        </div>${V.pack?reflForm('파일에 담길 나의 성찰과 계획'):''}`;
    }
    $app.innerHTML = `<div class="wrap player">${head}${body}</div><div class="leave-note">⚠️ 뒤로가기·창 닫기를 하면 원탁을 떠나요</div>`;
    rendered = !V ? '' : !V.joined ? (V.phase==='lobby' ? 'join' : 'rejoin') : V.phase; renderedCur = V ? V.cur : -1;
    if(focused){ const el=document.getElementById(focused); if(el){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){} } }
  }
  function kindPlaceholder(){ return kind==='question'?'이 어젠더의 주인에게 묻고 싶은 질문':kind==='advice'?'건네고 싶은 조언':'떠오르는 생각이나 느낌'; }
  function writingLive(){
    return `${V.mine.length?`<p class="small muted mt">내가 보낸 의견 ${V.mine.length}개 (공개 전까지 지울 수 있어요)</p><ul class="mine">${V.mine.map(e=>`<li><span class="tag ${e.kind}">${KINDS[e.kind]}</span><span class="t">${esc(e.text)}</span><button data-del="${esc(e.id)}">지우기</button></li>`).join('')}</ul>`:''}
          <p class="small muted mt center">지금까지 모인 의견 ${V.count}개</p>`;
  }
  function list(now){ return `<ol class="agenda-list">${V.agendas.map((a,i)=>`<li class="${i===now?'now':''}"><span class="num">${i+1}</span><span>${esc(a)}</span></li>`).join('')}</ol>`; }

  function packText(){
    const p = V.pack, d = new Date();
    const kn = k => KINDS[k].replace(/^\S+\s/,'');
    const lines = [`가면의 원탁 — 나의 기록`, `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} · 가명 ${V.me.nick}`, ``, `■ 나의 어젠더`, p.agenda, ``, `■ 받은 의견 ${p.items.length}개`];
    p.items.forEach((e,i)=>{ lines.push(``, `${i+1}. [${kn(e.kind)}]${e.likes?` ♥${e.likes}`:''}`, e.text); });
    const given = V.given || [];
    lines.push(``, ``, `■ 내가 남긴 의견 ${given.reduce((n,g)=>n+g.items.length,0)}개`);
    given.forEach(g=>{ lines.push(``, `[${g.no}번 어젠더] ${g.agenda}`); g.items.forEach(e=>lines.push(`- [${kn(e.kind)}]${e.likes?` ♥${e.likes}`:''} ${e.text}`)); });
    lines.push(``, ``, `■ 오늘 성찰하거나 새롭게 본 것`, (refl.insight||'').trim() || '', ``, `■ 앞으로의 계획 (첫 번째 행동과 언제 할지)`, (refl.plan||'').trim() || '', ``);
    return lines.join('\n');
  }

  $app.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.kind){ kind=b.dataset.kind; render(); return; }
    if(b.dataset.del){ tr.send({t:'delEntry', token, id:b.dataset.del}); return; }
    if(b.dataset.like){ tr.send({t:'like', token, id:b.dataset.like}); return; }
    const a = b.dataset.act;
    if(a==='rejoin'){
      const nick = document.getElementById('rejoinNick').value.trim();
      if(!nick){ document.getElementById('rejoinNick').focus(); return; }
      sending=true; err=''; render(); tr.send({t:'rejoin', token, nick});
      setTimeout(()=>{ if(sending){ sending=false; render(); } }, 6000);
    }
    if(a==='join'){
      const nick = document.getElementById('nick').value.trim(), agenda = document.getElementById('agenda').value.trim();
      if(!nick || !agenda){ err='가명과 어젠더를 모두 적어 주세요.'; render(); return; }
      sending=true; err=''; render(); tr.send({t:'join', token, nick, agenda});
      setTimeout(()=>{ if(sending){ sending=false; render(); } }, 6000);
    }
    if(a==='send'){
      const ta = document.getElementById('entryText'); const text = ta.value.trim();
      if(!text){ ta.focus(); return; }
      tr.send({t:'entry', token, id:rid(10), kind, text}); draft=''; ta.value=''; toast('보냈어요');
    }
    if(a==='download'){
      const blob = new Blob(['﻿'+packText()], {type:'text/plain;charset=utf-8'});
      const u = URL.createObjectURL(blob); const link = document.createElement('a');
      link.href=u; link.download=`가면의원탁_${V.me.nick}.txt`; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(()=>URL.revokeObjectURL(u), 5000);
    }
    if(a==='copy'){ navigator.clipboard?.writeText(packText()).then(()=>toast('복사했어요. 메모나 카톡에 붙여 넣으세요'),()=>toast('복사에 실패했어요')); }
  });
  render();
}

/* ===================== 첫 화면 ===================== */
function landing(){
  const saved = Object.keys(localStorage).filter(k=>k.startsWith(PREFIX+'host-')).map(k=>k.slice((PREFIX+'host-').length));
  $app.innerHTML = `<div class="wrap">
    <header class="top"><div class="brand">가면의 원탁<small>익명으로 서로의 어젠더를 비추는 시간</small></div></header>
    <div class="card">
      <h1>모두가 가면을 쓰고 원탁에 앉습니다</h1>
      <p class="muted">각자 가명과 어젠더를 적고, 누구의 고민인지 모르는 채로 생각·조언·질문을 나눠요. 어젠더 주인은 끝까지 비밀로 남아요.</p>
      <button class="btn block big mt" id="mk">진행자로 모임 만들기</button>
      ${saved.length?`<div class="mt">${saved.map(c=>`<button class="btn block ghost mt" data-resume="${esc(c)}">진행 중인 모임 이어가기 · ${esc(c)}</button>`).join('')}</div>`:''}
    </div>
    <div class="card">
      <h2>참가자로 들어가기</h2>
      <p class="muted small">진행자 화면의 QR을 찍거나, 방 번호 4자리를 입력해 주세요.</p>
      <label for="rc">방 번호</label>
      <div class="row"><input type="text" id="rc" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="1234" style="flex:1;letter-spacing:.2em;font-weight:700"><button class="btn" id="go">입장</button></div>
    </div>
  </div>`;
  document.getElementById('mk').onclick = async e=>{ e.target.disabled = true; e.target.textContent = '방 만드는 중…'; const c = await freeCode(); store.set('own-'+c, 1); location.href = baseUrl()+'?host='+c; };
  document.getElementById('go').onclick = ()=>{ const c=document.getElementById('rc').value.trim(); if(CODE_RE.test(c)) location.href = baseUrl()+'?room='+c; };
  $app.querySelectorAll('[data-resume]').forEach(b=>b.onclick=()=>{ location.href = baseUrl()+'?host='+b.dataset.resume; });
}

/* ===================== 시작 ===================== */
(function boot(){
  const host = (params.get('host')||'').trim(), room = (params.get('room')||'').trim();
  if(!fdb()){ $app.innerHTML = '<div class="wrap"><div class="card"><h2>연결 모듈을 불러오지 못했어요</h2><p class="muted">인터넷 연결을 확인한 뒤 새로고침해 주세요.</p></div></div>'; return; }
  // 진행자 주소가 공유되어도, 그 방을 만든 기기가 아니면 참가자 화면으로 보냄
  if(CODE_RE.test(host)){ if(store.get('host-'+host) || store.get('own-'+host)) runHost(host); else location.replace(baseUrl()+'?room='+host); }
  else if(CODE_RE.test(room)) runPlayer(room);
  else landing();
})();
</script>
</body>
</html>
